<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure & Natural - Fresh Juices & Ice Creams</title>
    <link rel="icon" href="img/favicon.png" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <section id="contact" class="py-5 bg-dark text-white">
        <div class="container">
            <h2 class="text-center mb-5 section-title text-white">Visit Us or Get in Touch</h2>
            <div class="row">
                <div class="col-md-6 mb-4 mb-md-0" data-gsap-animation="contact-info">
                    <h3><i class="fas fa-map-marker-alt me-2"></i> Our Location</h3>
                    <p>123 Nature's Way, Green City, GC 12345</p>
                    <p><strong><i class="fas fa-clock me-2"></i> Hours:</strong> Mon-Sat: 10 AM - 9 PM | Sunday: 11 AM - 7 PM</p>
                    <p><strong><i class="fas fa-phone me-2"></i> Phone:</strong> (123) 456-7890</p>
                    <p><strong><i class="fas fa-envelope me-2"></i> Email:</strong> info@pureandnatural.com</p>
                    <div class="map-container rounded shadow-lg">
                         <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3022.2599761019973!2d-73.98785988459468!3d40.74844097932824!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c25983794b6389%3A0xc54030612c668b5a!2sEmpire%20State%20Building!5e0!3m2!1sen!2sus!4v1678901234567!5m2!1sen!2sus" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </div>
                <div class="col-md-6" data-gsap-animation="contact-form">
                    <h3><i class="fas fa-comment-dots me-2"></i> Send Us a Message</h3>
                    <form class="contact-form">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="subject" class="form-label">Subject</label>
                            <input type="text" class="form-control" id="subject">
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control" id="message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary submit-btn">Send Message <i class="fas fa-paper-plane ms-2"></i></button>
                    </form>
                </div>
            </div>
            <p class="text-center mt-5 mb-0">
                <a href="terms.html" class="back-link">
                    <i class="fas fa-file-contract me-2"></i>Terms &amp; Conditions &amp; Copyright
                </a>
            </p>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.164.1/three.min.js"></script>
    <script src="https://unpkg.com/three@0.164.1/examples/jsm/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/three@0.164.1/examples/jsm/controls/OrbitControls.js"></script>
    <script src="script.js"></script>
</body>
</html>
